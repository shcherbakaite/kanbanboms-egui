[package]
name = "kanbanboms-app"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "wasmbind", "clock"] }
csv = "1.3"
regex = "1.10"
once_cell = "1.19"
rand = "0.8"
egui-data-table = { path = "../egui-data-table" }
egui_dock = "0.18"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
opener = "0.7"
rfd = "0.15"
genpdf = "0.2"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Blob", "Url", "UrlSearchParams", "FileReader", "File", "FileList", "HtmlInputElement"] }
js-sys = "0.3"
gloo-storage = "0.3"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
